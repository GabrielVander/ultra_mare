[workspace]
members = ["app-ascii", "lib-colony", "lib-terrain", "lib-unit", "lib-world-generation"]
resolver = "3"

# Debug info is dropped because the code is not debugged; it dominated link times.
[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Table-driven tests and Bevy systems iterate with `for_each` closures on purpose.
needless_for_each = "allow"
