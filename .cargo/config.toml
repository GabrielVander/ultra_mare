# Coverage must stay at 100%. The Bevy entry point is left out: it is the humble
# view, holding no logic worth testing.
[alias]
cov = [
    "llvm-cov",
    "--workspace",
    "--ignore-filename-regex", "app-ascii/src/main\\.rs",
    "--fail-under-lines", "100",
    "--fail-under-functions", "100",
    "--fail-under-regions", "100",
]
